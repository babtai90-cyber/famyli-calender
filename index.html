<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Calendar</title>
<style>
:root{--bg:#07090c;--panel:#10151b;--panel2:#151c24;--line:#26313c;--text:#f5f7fa;--muted:#8e9aa7;--accent:#73d7ff;--accent2:#a98cff;--good:#79e0ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#142330 0,#090c10 42%,#050608 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#fff 0,#73d7ff 16%,#276d91 42%,transparent 70%);box-shadow:0 0 25px #43cfff88;animation:pulse 3s infinite}.title{font-size:24px;font-weight:750;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.status{border:1px solid #29404d;background:#0d171e;padding:9px 13px;border-radius:999px;color:var(--good);font-size:12px}.grid{display:grid;grid-template-columns:1.7fr .9fr;gap:18px}.panel{background:linear-gradient(145deg,#121820dd,#0c1015dd);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(14px)}.calendar{padding:20px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.month h1{margin:0;font-size:22px}.nav button,.add{background:#17212a;border:1px solid #2c3c49;color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:7px}.day{min-height:82px;padding:9px;border:1px solid #202b35;border-radius:15px;background:#0c1116;cursor:pointer;transition:.18s}.day:hover{border-color:#4b7185;transform:translateY(-1px)}.day.muted{opacity:.38}.num{font-size:12px;color:#b7c0ca}.today{outline:1px solid var(--accent);box-shadow:0 0 20px #73d7ff18}.event{margin-top:7px;padding:5px 7px;border-radius:7px;background:#173b4a;color:#bdefff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.purple{background:#302448;color:#d9ccff}.side{padding:20px}.side h2{margin:0 0 15px;font-size:18px}.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #202831}.time{width:48px;color:var(--accent);font-weight:700;font-size:13px}.item b{font-size:14px}.item small{display:block;color:var(--muted);margin-top:3px}.actions{display:flex;gap:10px;margin-top:18px}.add{flex:1;background:linear-gradient(135deg,#193847,#18243a);border-color:#3b6476}.update{width:100%;margin-top:10px;background:transparent;border:1px solid #29343e;color:var(--muted);padding:10px;border-radius:12px;cursor:pointer}.hudline{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3;margin:22px 0}.toast{position:fixed;right:18px;bottom:18px;background:#111920;border:1px solid #344450;padding:13px 16px;border-radius:14px;display:none;box-shadow:0 15px 40px #0009}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal .box{max-width:430px;width:100%;background:#11171e;border:1px solid #33414d;border-radius:20px;padding:22px}.modal input{width:100%;padding:12px;margin:7px 0;background:#0a0e12;color:white;border:1px solid #2b3741;border-radius:10px}.modal button{margin-top:8px;width:100%;padding:12px;border:0;border-radius:10px;background:#73d7ff;color:#061016;font-weight:700}.close{background:transparent!important;color:#9ba7b2!important;border:1px solid #2b3741!important}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.day{min-height:62px}.event{display:none}.app{padding:14px}.top{align-items:flex-start}.status{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="orb"></div><div><div class="title">Family Calendar</div><div class="sub">Šeimos centras • Rugsėjis 2026</div></div></div><div class="status">● SINCHRONIZUOTA</div></header>
<div class="grid">
<section class="panel calendar"><div class="month"><div><h1>Rugsėjis 2026</h1><div class="sub">Šeimos kalendorius</div></div><div class="nav"><button onclick="changeMonth(-1)">‹</button> <button onclick="changeMonth(1)">›</button></div></div>
<div class="week"><div>Pirm</div><div>Antr</div><div>Treč</div><div>Ketv</div><div>Penkt</div><div>Šešt</div><div>Sekm</div></div><div class="days" id="days"></div>
<div class="hudline"></div><div class="actions"><button class="add" onclick="openModal()">＋ Naujas įvykis</button></div><button class="update" onclick="checkUpdate()">Patikrinti programos atnaujinimą</button>
</section>
<aside class="panel side"><h2>Šiandien</h2><div class="item"><div class="time">08:00</div><div><b>Mokykla</b><small>Šeima</small></div></div><div class="item"><div class="time">12:30</div><div><b>Pietūs</b><small>Visi</small></div></div><div class="item"><div class="time">18:00</div><div><b>Šeimos susitikimas</b><small>Tėvai</small></div></div><div class="item"><div class="time">20:00</div><div><b>Ramūs vakaro planai</b><small>Šeima</small></div></div></aside>
</div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h2>+ Naujas įvykis</h2><input id="eventTitle" placeholder="Įvykio pavadinimas"><input id="eventTime" type="time" value="18:00"><button onclick="addEvent()">Pridėti</button><button class="close" onclick="closeModal()">Atšaukti</button></div></div>
<script>
let offset=0;const events={8:[['Mokykla','08:00'],['Šeimos planas','18:00']],12:[['Pietūs','12:30']],15:[['Susitikimas','18:00']]};
function render(){const d=new Date(2026,8+offset,1),year=d.getFullYear(),month=d.getMonth(),first=(d.getDay()+6)%7,last=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate(),el=document.getElementById('days');document.querySelector('h1').textContent=d.toLocaleDateString('lt-LT',{month:'long',year:'numeric'});el.innerHTML='';for(let i=0;i<first;i++)el.innerHTML+=`<div class="day muted"><span class="num">${prev-first+i+1}</span></div>`;for(let n=1;n<=last;n++){let cls=(year===2026&&month===8&&n===8)?'day today':'day';let es=events[n]||[];el.innerHTML+=`<div class="${cls}" onclick="selectDay(${n})"><span class="num">${n}</span>${es.map((e,i)=>`<div class="event ${i?'purple':''}">${e[0]}</div>`).join('')}</div>`}for(let i=1;el.children.length<42;i++)el.innerHTML+=`<div class="day muted"><span class="num">${i}</span></div>`}
function changeMonth(x){offset+=x;render()}function selectDay(n){toast('Pasirinkta diena: '+n)}function openModal(){document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function addEvent(){const t=document.getElementById('eventTitle').value||'Naujas įvykis';const time=document.getElementById('eventTime').value;toast(`Įvykis „${t}“ sukurtas ${time}`);closeModal()}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}function checkUpdate(){toast('Tikrinama naujausia versija…');setTimeout(()=>toast('Šiuo metu naujesnės versijos nėra.'),1000)}render();
</script>
</body></html>

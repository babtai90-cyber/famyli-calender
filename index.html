<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Calendar</title>
<style>
:root{--bg:#f4f6f8;--panel:#ffffffee;--panel2:#f8fafc;--line:#dfe4e8;--text:#11151a;--muted:#6f7882;--accent:#111820;--accent2:#59636e;--good:#2d8a61}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#ffffff 0,#f1f4f6 48%,#e7ebee 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#111 0,#fff 18%,#cbd2d8 43%,transparent 70%);box-shadow:0 0 25px #7d879088;animation:pulse 3s infinite}.title{font-size:24px;font-weight:750;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.status{border:1px solid #cfd7dd;background:#fff;padding:9px 13px;border-radius:999px;color:var(--good);font-size:12px}.grid{display:grid;grid-template-columns:1.7fr .9fr;gap:18px}.panel{background:linear-gradient(145deg,#ffffffee,#f7f9faee);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #7b858f22;backdrop-filter:blur(14px)}.calendar{padding:20px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.month h1{margin:0;font-size:22px}.nav button,.add{background:#fff;border:1px solid #cfd7dd;color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:7px}.day{min-height:82px;padding:9px;border:1px solid #e0e5e9;border-radius:15px;background:#fff;cursor:pointer;transition:.18s}.day:hover{border-color:#9aa5ae;transform:translateY(-1px)}.day.muted{opacity:.38}.num{font-size:12px;color:#5e6872}.today{outline:1px solid #111820;box-shadow:0 0 20px #6f7a8418}.event{margin-top:7px;padding:5px 7px;border-radius:7px;background:#e9edf0;color:#20272e;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.purple{background:#ececf0;color:#454a51}.side{padding:20px}.side h2{margin:0 0 15px;font-size:18px}.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #e4e8eb}.time{width:48px;color:#252d34;font-weight:700;font-size:13px}.item b{font-size:14px}.item small{display:block;color:var(--muted);margin-top:3px}.actions{display:flex;gap:10px;margin-top:18px}.add{flex:1;background:linear-gradient(135deg,#111820,#343d45);border-color:#111820;color:#fff}.update{width:100%;margin-top:10px;background:transparent;border:1px solid #cfd7dd;color:#68727c;padding:10px;border-radius:12px;cursor:pointer}.hudline{height:1px;background:linear-gradient(90deg,transparent,#111820,transparent);opacity:.22;margin:22px 0}.toast{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid #d1d8dd;padding:13px 16px;border-radius:14px;display:none;box-shadow:0 15px 40px #6f788233}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:20px}.modal .box{max-width:430px;width:100%;background:#fff;border:1px solid #d5dce1;border-radius:20px;padding:22px;box-shadow:0 25px 70px #0003}.modal input{width:100%;padding:12px;margin:7px 0;background:#f8fafb;color:#111820;border:1px solid #d2d9de;border-radius:10px}.modal button{margin-top:8px;width:100%;padding:12px;border:0;border-radius:10px;background:#111820;color:#fff;font-weight:700}.close{background:transparent!important;color:#6c7680!important;border:1px solid #d2d9de!important}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.day{min-height:62px}.event{display:none}.app{padding:14px}.top{align-items:flex-start}.status{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="orb"></div><div><div class="title">Family Calendar</div><div class="sub">Šeimos centras • Rugsėjis 2026</div></div></div><div class="status">● SINCHRONIZUOTA</div></header>
<div class="grid">
<section class="panel calendar"><div class="month"><div><h1>Rugsėjis 2026</h1><div class="sub">Šeimos kalendorius</div></div><div class="nav"><button onclick="changeMonth(-1)">‹</button> <button onclick="changeMonth(1)">›</button></div></div>
<div class="week"><div>Pirm</div><div>Antr</div><div>Treč</div><div>Ketv</div><div>Penkt</div><div>Šešt</div><div>Sekm</div></div><div class="days" id="days"></div>
<div class="hudline"></div><div class="actions"><button class="add" onclick="openModal()">＋ Naujas įvykis</button></div><button class="update" onclick="checkUpdate()">Patikrinti programos atnaujinimą</button>
</section>
<aside class="panel side"><h2>Šiandien</h2><div class="item"><div class="time">08:00</div><div><b>Mokykla</b><small>Šeima</small></div></div><div class="item"><div class="time">12:30</div><div><b>Pietūs</b><small>Visi</small></div></div><div class="item"><div class="time">18:00</div><div><b>Šeimos susitikimas</b><small>Tėvai</small></div></div><div class="item"><div class="time">20:00</div><div><b>Ramūs vakaro planai</b><small>Šeima</small></div></div></aside>
</div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h2>+ Naujas įvykis</h2><input id="eventTitle" placeholder="Įvykio pavadinimas"><input id="eventTime" type="time" value="18:00"><button onclick="addEvent()">Pridėti</button><button class="close" onclick="closeModal()">Atšaukti</button></div></div>
<script>
let offset=0;const events={8:[['Mokykla','08:00'],['Šeimos planas','18:00']],12:[['Pietūs','12:30']],15:[['Susitikimas','18:00']]};
function render(){const d=new Date(2026,8+offset,1),year=d.getFullYear(),month=d.getMonth(),first=(d.getDay()+6)%7,last=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate(),el=document.getElementById('days');document.querySelector('h1').textContent=d.toLocaleDateString('lt-LT',{month:'long',year:'numeric'});el.innerHTML='';for(let i=0;i<first;i++)el.innerHTML+=`<div class="day muted"><span class="num">${prev-first+i+1}</span></div>`;for(let n=1;n<=last;n++){let cls=(year===2026&&month===8&&n===8)?'day today':'day';let es=events[n]||[];el.innerHTML+=`<div class="${cls}" onclick="selectDay(${n})"><span class="num">${n}</span>${es.map((e,i)=>`<div class="event ${i?'purple':''}">${e[0]}</div>`).join('')}</div>`}for(let i=1;el.children.length<42;i++)el.innerHTML+=`<div class="day muted"><span class="num">${i}</span></div>`}
function changeMonth(x){offset+=x;render()}function selectDay(n){toast('Pasirinkta diena: '+n)}function openModal(){document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}function addEvent(){const t=document.getElementById('eventTitle').value||'Naujas įvykis';const time=document.getElementById('eventTime').value;toast(`Įvykis „${t}“ sukurtas ${time}`);closeModal()}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}function checkUpdate(){toast('Tikrinama naujausia versija…');setTimeout(()=>toast('Šiuo metu naujesnės versijos nėra.'),1000)}render();
</script>
</body></html>
